<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>2018 MC3 Network Analysis</title>
        <style type="text/css">
            body {
                font-family: sans-serif;
            }

            .flex {
                display: flex;
            }
            
            .fileInput, .slider {
                margin: 20px 0;
                padding: 15px;
                border: 2px solid #ccc;
                border-radius: 5px;
                background-color: #f9f9f9;
                width: 100%;
            }
            
            .fileInput label {
                display: block;
                margin-bottom: 10px;
                font-size:x-large;
            }

            .fileInput p {
                margin: 10px 0 0 0;
            }
            
            .slider h3 {
                margin-top: 0;
            }
        </style>
        <script type="text/javascript" src="d3.v7.min.js"></script>
    </head>
    <body>
        <div>
            <h1 style="margin: 0;">2018 MC3 Network Analysis</h1>
        </div>
        <div class="flex">
            <div class="fileInput">
                <label for="uploadFiles">Load CSV or JSON Data Files:</label>
                <input type="file" id="uploadFiles" accept=".json,.csv" multiple>
                <p id="fileStatus" style="margin-top: 10px; color: #666;"></p>
            </div>
        </div>

        <div class="flex">
            <div class="slider">
                <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 15px;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <label for="daysRange">Days Before/After:</label>
                        <input type="number" id="daysRange" value="7" min="0" step="1" style="width: 80px; padding: 5px;">
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <label for="dualRangeToggle">Dual Range Control:</label>
                        <input type="checkbox" id="dualRangeToggle" style="width: 20px; height: 20px;">
                    </div>
                </div>
                <div>Timeline</div>
                <svg id="timeSlider" height="80px"></svg>
            </div>
        </div>
        
        <svg id="shapes"></svg>

        <script type="text/javascript" src="data.js"></script>
        <script type="text/javascript" src="coreJs.js"></script>
    </body>
</html>
